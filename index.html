<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ada Chatbot Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

            button:hover {
                background-color: #45a049;
            }

        #timerDisplay {
            margin-top: 20px;
            padding: 20px;
            background-color: #f0f0f0;
            border-radius: 8px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .timer-active {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .timer-warning {
            background-color: #fff3e0;
            color: #e65100;
        }

        .timer-critical {
            background-color: #ffebee;
            color: #c62828;
        }

        #customPopup {
            display: none;
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 400px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            padding: 20px;
            z-index: 100000;
            font-family: Arial, sans-serif;
        }

            #customPopup.show {
                display: block;
                animation: slideUp 0.3s ease-out;
            }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        #customPopup h3 {
            margin: 0 0 15px 0;
            font-size: 16px;
            color: #333;
            font-weight: normal;
        }

        #customPopup .emoji {
            font-size: 20px;
            margin-right: 8px;
        }

        .popup-button {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 2px solid #4CAF50;
            border-radius: 6px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            transition: all 0.2s;
        }

            .popup-button:hover {
                background: #45a049;
                border-color: #45a049;
            }

            .popup-button.secondary {
                background: white;
                color: #999;
                border: none;
                font-weight: normal;
                padding: 10px;
            }

                .popup-button.secondary:hover {
                    background: #f5f5f5;
                    color: #999;
                }
    </style>
    <script id="__ada"
            data-handle="supportnex"
            src="https://static.ada.support/embed2.js">
    </script>
    <script>
        let conversationId = null;
        let inactivityTimer = null;
        let secondInactivityTimer = null;
        let countdownInterval = null;
        let timeRemaining = 18;
        let firstPopupShown = false;
        let secondPopupShown = false;

        let timerDisplay;
        let countdownElement;
        let statusElement;
        let customPopup;

        // Function to show custom popup
        function showCustomPopup() {
            if (customPopup) {
                customPopup.classList.add('show');
            }
        }

        // Function to hide custom popup
        function hideCustomPopup() {
            if (customPopup) {
                customPopup.classList.remove('show');
            }
        }

        // Function to ensure chat drawer is open
        function ensureChatOpen() {
            return new Promise((resolve, reject) => {
                if (window.adaEmbed && typeof window.adaEmbed.getInfo === "function") {
                    window.adaEmbed.getInfo().then(function (windowInfo) {
                        console.log("Is the drawer open?", windowInfo.isDrawerOpen ? "Yes" : "No");

                        if (!windowInfo.isDrawerOpen && typeof window.adaEmbed.toggle === "function") {
                            window.adaEmbed.toggle();
                        }
                        resolve(windowInfo);
                    }).catch(function (error) {
                        console.error("Error checking chat status:", error);
                        reject(error);
                    });
                } else {
                    reject(new Error("Ada Embed not ready"));
                }
            });
        }

        // Update countdown display
        function updateCountdown() {
            if (!countdownElement || !timerDisplay) return;

            countdownElement.textContent = timeRemaining + 's';

            // Change color based on time remaining
            timerDisplay.classList.remove('timer-active', 'timer-warning', 'timer-critical');
            if (timeRemaining > 10) {
                timerDisplay.classList.add('timer-active');
            } else if (timeRemaining > 5) {
                timerDisplay.classList.add('timer-warning');
            } else {
                timerDisplay.classList.add('timer-critical');
            }
        }

        // Function to reset inactivity timer
        function resetInactivityTimer() {
            // Only stop if both popups have been shown
            if (firstPopupShown && secondPopupShown) {
                // Both popups shown, just update UI to show completion
                if (statusElement) {
                    statusElement.textContent = 'All re-engagement popups completed';
                }
                if (countdownElement) {
                    countdownElement.textContent = 'Done';
                }
                return;
            }

            // Clear existing timers
            if (inactivityTimer) {
                clearTimeout(inactivityTimer);
            }
            if (secondInactivityTimer) {
                clearTimeout(secondInactivityTimer);
            }
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }

            // If first popup already shown, reset for second popup
            if (firstPopupShown && !secondPopupShown) {
                // Reset countdown for second popup (60 seconds)
                timeRemaining = 60;
                updateCountdown();

                if (statusElement) {
                    statusElement.textContent = 'Second popup timer reset - waiting 60s...';
                }

                // Start countdown display for second popup
                countdownInterval = setInterval(() => {
                    timeRemaining--;
                    updateCountdown();

                    if (timeRemaining <= 0) {
                        clearInterval(countdownInterval);
                    }
                }, 1000);

                // Set timer for second popup
                secondInactivityTimer = setTimeout(() => {
                    if (secondPopupShown) return;

                    console.log("1 minute passed, triggering second re-engagement");
                    secondPopupShown = true;

                    if (statusElement) {
                        statusElement.textContent = 'Second re-engagement triggered!';
                    }
                    if (countdownElement) {
                        countdownElement.textContent = '0s';
                    }

                    setTimeout(() => {
                        showCustomPopup();
                    }, 500);
                }, 60000);

                return;
            }

            // First popup not shown yet, reset for first popup
            timeRemaining = 18;
            updateCountdown();

            if (statusElement) {
                statusElement.textContent = 'Timer active - waiting for first popup...';
            }

            // Start countdown display
            countdownInterval = setInterval(() => {
                timeRemaining--;
                updateCountdown();

                if (timeRemaining <= 0) {
                    clearInterval(countdownInterval);
                }
            }, 1000);

            // Set timer for first popup (18 seconds)
            inactivityTimer = setTimeout(() => {
                if (firstPopupShown) return; // Already shown

                console.log("No activity for 18 seconds, triggering first re-engagement");
                firstPopupShown = true;

                if (statusElement) {
                    statusElement.textContent = 'First re-engagement triggered!';
                }

                // Show popup without checking drawer state
                // Popup appears whether drawer is open or closed
                setTimeout(() => {
                    showCustomPopup();
                }, 500);

                // Start timer for second popup (1 minute = 60 seconds)
                // This runs regardless of user interaction after first popup
                if (!secondPopupShown) {
                    timeRemaining = 60;
                    updateCountdown();

                    if (statusElement) {
                        statusElement.textContent = 'Waiting for second popup (60s)...';
                    }

                    // Start countdown for second popup
                    countdownInterval = setInterval(() => {
                        timeRemaining--;
                        updateCountdown();

                        if (timeRemaining <= 0) {
                            clearInterval(countdownInterval);
                        }
                    }, 1000);

                    secondInactivityTimer = setTimeout(() => {
                        if (secondPopupShown) return; // Already shown

                        console.log("1 minute passed, triggering second re-engagement");
                        secondPopupShown = true;

                        if (statusElement) {
                            statusElement.textContent = 'Second re-engagement triggered!';
                        }
                        if (countdownElement) {
                            countdownElement.textContent = '0s';
                        }

                        // Show popup without checking drawer state
                        // Popup appears whether drawer is open or closed
                        setTimeout(() => {
                            showCustomPopup();
                        }, 500);
                    }, 60000); // 60 seconds
                }
            }, 18000); // 18 seconds
        }

        window.adaSettings = {
            chatterTokenCallback: (chatterToken) => {
                // Generate or retrieve your chatter token
                console.log("Providing chatter token:", chatterToken);

                // Reset inactivity timer when chatter token is provided
                resetInactivityTimer();
            },
            onAdaEmbedLoaded: () => {
                console.log("Ada Embed loaded successfully");

                // Subscribe to conversation messages
                window.adaEmbed.subscribeEvent("ada:conversation:message", (data) => {
                    conversationId = data.conversation_id;
                    console.log("Conversation ID:", conversationId);
                    localStorage.setItem("ada_conversation_id", conversationId);

                    // If popup is visible and user interacts with chat, auto-dismiss popup
                    if (customPopup && customPopup.classList.contains('show')) {
                        console.log("User interacted with chat, auto-dismissing popup");
                        hideCustomPopup();
                    }

                    // Reset inactivity timer on each message
                    resetInactivityTimer();
                });

                // Subscribe to drawer toggle events
                window.adaEmbed.subscribeEvent("ada:drawer_toggle", (data) => {
                    console.log("Drawer toggled:", data);
                    // Don't automatically hide popup when drawer is minimized
                    // Popup should stay open until user makes a choice
                });
            }
        };
    </script>
</head>
<body>
    <h1>Ada Chatbot Integration Demo</h1>

    <p>
        <button id="openChat">Open Chat</button>
        <button id="resetTimer" style="margin-left: 10px; background-color: #ff9800;">Reset Timer</button>
        <button id="resetChat" style="margin-left: 10px; background-color: #f44336;">Reset Chat</button>
    </p>

    <div id="timerDisplay">
        <div>Inactivity Timer</div>
        <div id="countdown" style="font-size: 36px; margin-top: 10px;">--</div>
        <div id="status" style="font-size: 14px; margin-top: 5px; font-weight: normal;">Waiting for activity...</div>
    </div>

    <div id="customPopup">
        <h3><span class="emoji">👋</span>Still there? Your free PC check-up is waiting!</h3>
        <button class="popup-button" id="needHelp">Start now</button>
        <button class="popup-button secondary" id="foundAnswer">No thanks</button>
    </div>

    <script>
        // Open chat button
        document.getElementById("openChat").addEventListener("click", () => {
            ensureChatOpen().then(function (windowInfo) {
                if (windowInfo.isDrawerOpen) {
                    console.log("Chat is already open");
                }
            }).catch(function (error) {
                console.error("Error opening chat:", error);
            });
        });

        // Reset timer button
        document.getElementById("resetTimer").addEventListener("click", () => {
            console.log("Manual timer reset");
            // Reset all popup flags
            firstPopupShown = false;
            secondPopupShown = false;
            // Clear second timer if exists
            if (secondInactivityTimer) {
                clearTimeout(secondInactivityTimer);
            }
            resetInactivityTimer();
        });

        // Reset chat button
        document.getElementById("resetChat").addEventListener("click", () => {
            if (window.adaEmbed && typeof window.adaEmbed.reset === "function") {
                console.log("Resetting Ada chat");
                window.adaEmbed.reset();

                // Clear conversation ID
                conversationId = null;
                localStorage.removeItem("ada_conversation_id");

                // Reset all popup flags
                firstPopupShown = false;
                secondPopupShown = false;

                // Clear second timer if exists
                if (secondInactivityTimer) {
                    clearTimeout(secondInactivityTimer);
                }

                // Reset timer as well
                resetInactivityTimer();

                // Hide popup
                hideCustomPopup();
            } else {
                console.error("Ada Embed reset function not available");
            }
        });

        // Popup button handlers
        document.getElementById("needHelp").addEventListener("click", () => {
            console.log("User clicked: Start now");

            // Reset timer when user clicks "Start now"
            resetInactivityTimer();

            // Open drawer and close popup
            ensureChatOpen().then(function (windowInfo) {
                console.log("Chat opened - drawer is now open");
                hideCustomPopup();
            }).catch(function (error) {
                console.error("Error opening chat:", error);
                hideCustomPopup();
            });
        });

        document.getElementById("foundAnswer").addEventListener("click", () => {
            console.log("User clicked: No thanks");
            // Close popup without opening drawer
            hideCustomPopup();
        });

        // Auto-open chat after delay
        function ensureAdaLoaded(callback) {
            let adaLoaded = false;

            const checkInterval = setInterval(() => {
                if (window.adaEmbed && typeof window.adaEmbed.toggle === "function") {
                    adaLoaded = true;
                    clearInterval(checkInterval);
                    callback();
                }
            }, 100);

            // Timeout after 10 seconds
            setTimeout(() => {
                if (!adaLoaded) {
                    clearInterval(checkInterval);
                    console.warn("Ada Embed did not load within timeout");
                }
            }, 10000);
        }

        // Auto-open chat after delay
        setTimeout(() => {
            ensureAdaLoaded(() => {
                console.log("Auto-opening chat widget");
                window.adaEmbed.toggle();
            });
        }, 2000);
    </script>

    <script>
        // Initialize DOM elements
        timerDisplay = document.getElementById('timerDisplay');
        countdownElement = document.getElementById('countdown');
        statusElement = document.getElementById('status');
        customPopup = document.getElementById('customPopup');
    </script>
</body>
</html>
